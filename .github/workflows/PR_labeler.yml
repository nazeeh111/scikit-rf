name: "Pull Request Labeler"
on:
- pull_request_target

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          .github
    - uses: actions/labeler@v7
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        sync-labels: true
